[project]
name = "gaokao-agent-backend"
version = "0.1.0"
description = "志愿领航 Agent 后端 —— 里程碑1：FastAPI + PostgreSQL 骨架"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
    "email-validator>=2.0.0",
    "mcp>=1.2.0,<2.0.0",  # mcp 2.x 有破坏性 API 变更（FastMCP 挪位置+改名），代码是照 v1 API 写的，先锁定大版本
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pgvector>=0.3.0",   # policy_chunks 表的向量列，数据库本身也需要装 pgvector 扩展
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
