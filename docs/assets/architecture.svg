<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">志愿领航 Agent 架构</text>

  <!-- user -->
  <rect x="40" y="70" width="150" height="56" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="115" y="104" text-anchor="middle" font-size="15" fill="#0f172a">考生 / 前端</text>

  <!-- orchestrator -->
  <rect x="250" y="62" width="670" height="72" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="270" y="88" font-size="16" font-weight="700" fill="#075985">Orchestrator 编排器</text>
  <text x="270" y="112" font-size="13" fill="#0c4a6e">意图路由（LLM + 关键词降级） · 步骤规划 · 按考生限流 · 全链路 trace 落库</text>
  <line x1="190" y1="98" x2="248" y2="98" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- three agents -->
  <rect x="250" y="190" width="200" height="110" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="350" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">Profile Agent</text>
  <text x="350" y="240" text-anchor="middle" font-size="12.5" fill="#78350f">结构化输出 · 槽位抽取</text>
  <text x="350" y="260" text-anchor="middle" font-size="12.5" fill="#78350f">确定性必填校验 · 追问</text>
  <text x="350" y="280" text-anchor="middle" font-size="12.5" fill="#78350f">每轮最多追问 2 项</text>

  <rect x="480" y="190" width="200" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="580" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Retrieval Agent</text>
  <text x="580" y="240" text-anchor="middle" font-size="12.5" fill="#14532d">ReAct 工具调用循环</text>
  <text x="580" y="260" text-anchor="middle" font-size="12.5" fill="#14532d">候选检索 · 详情 · 对比</text>
  <text x="580" y="280" text-anchor="middle" font-size="12.5" fill="#14532d">finalize 守卫</text>

  <rect x="710" y="190" width="210" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="815" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">Advisor Agent</text>
  <text x="815" y="240" text-anchor="middle" font-size="12.5" fill="#4c1d95">冲/稳/保方案解读</text>
  <text x="815" y="260" text-anchor="middle" font-size="12.5" fill="#4c1d95">信息差院校逐一说明</text>
  <text x="815" y="280" text-anchor="middle" font-size="12.5" fill="#4c1d95">不输出录取概率</text>

  <line x1="450" y1="245" x2="478" y2="245" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="680" y1="245" x2="708" y2="245" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="350" y1="134" x2="350" y2="188" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="580" y1="134" x2="580" y2="188" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="815" y1="134" x2="815" y2="188" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- tools row -->
  <text x="40" y="352" font-size="14" font-weight="700" fill="#0f172a">工具层（被 Agent 调用）</text>
  <rect x="40" y="366" width="280" height="96" rx="10" fill="#fff7ed" stroke="#ea580c"/>
  <text x="180" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">规则引擎（确定性）</text>
  <text x="180" y="414" text-anchor="middle" font-size="12.5" fill="#7c2d12">硬约束过滤 · 冲/稳/保 3:4:3 分档</text>
  <text x="180" y="434" text-anchor="middle" font-size="12.5" fill="#7c2d12">跨年位次等效（本科上线人数口径）</text>
  <text x="180" y="454" text-anchor="middle" font-size="12.5" fill="#7c2d12">"信息差"院校挖掘</text>

  <rect x="340" y="366" width="280" height="96" rx="10" fill="#ecfeff" stroke="#0891b2"/>
  <text x="480" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#155e75">政策 RAG（search_policy）</text>
  <text x="480" y="414" text-anchor="middle" font-size="12.5" fill="#164e63">OCR 兜底 · 章节标题切分</text>
  <text x="480" y="434" text-anchor="middle" font-size="12.5" fill="#164e63">向量 + BM25 → RRF 融合</text>
  <text x="480" y="454" text-anchor="middle" font-size="12.5" fill="#164e63">回答附原文出处</text>

  <rect x="640" y="366" width="280" height="96" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="780" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">MCP 客户端 + Skill 目录</text>
  <text x="780" y="414" text-anchor="middle" font-size="12.5" fill="#334155">外部工具接入</text>
  <text x="780" y="434" text-anchor="middle" font-size="12.5" fill="#334155">领域知识按需加载（load_skill）</text>

  <line x1="580" y1="300" x2="200" y2="364" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <line x1="580" y1="300" x2="480" y2="364" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <line x1="580" y1="300" x2="760" y2="364" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <!-- data -->
  <rect x="40" y="500" width="880" height="62" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="60" y="526" font-size="14" font-weight="700" fill="#0f172a">数据层：PostgreSQL + pgvector</text>
  <text x="60" y="546" font-size="12.5" fill="#334155">院校 · 专业组 · 历年录取位次（2023–2025）· 一分一段 · 政策文本片段与向量 · 对话 / 方案 / Agent 运行轨迹</text>
  <line x1="180" y1="462" x2="180" y2="498" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="480" y1="462" x2="480" y2="498" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
